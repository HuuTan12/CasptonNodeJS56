services:
  mysql:
    image: mysql:8.0
    container_name: airbnb_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
      MYSQL_DATABASE: db_airbnb
    ports:
      - "3307:3306"
    volumes:
      - airbnb_mysql_data:/var/lib/mysql

volumes:
  airbnb_mysql_data:

